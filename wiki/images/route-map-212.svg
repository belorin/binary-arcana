<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
<rect width="100%" height="100%" fill="#fbfaf6"/>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9a6d8" stroke-width="2"/></pattern></defs>
<text x="32" y="44" font-size="21" font-weight="700" fill="#252b29">항로력 212년 별계 항로도</text>
<text x="32" y="68" font-size="13" fill="#66716a">노선도처럼 그렸다. 위치는 실제 거리나 궤도와 상관없고, 어느 항구가 어디와 이어지는지만 보인다.</text>
<rect x="32" y="110" width="300" height="340" rx="16" fill="#ffffff" stroke="#dfe3db" stroke-width="1.5"/>
<text x="48" y="136" font-size="15" font-weight="700" fill="#252b29">누리</text>
<text x="48" y="154" font-size="11.5" fill="#66716a">고향 행성 · 수백만 명</text>
<rect x="700" y="96" width="268" height="150" rx="16" fill="#ffffff" stroke="#dfe3db" stroke-width="1.5"/>
<text x="716" y="122" font-size="15" font-weight="700" fill="#252b29">건너별</text>
<text x="716" y="140" font-size="11.5" fill="#66716a">춥고 바람 세다</text>
<rect x="720" y="282" width="248" height="128" rx="16" fill="#ffffff" stroke="#dfe3db" stroke-width="1.5"/>
<text x="736" y="308" font-size="15" font-weight="700" fill="#252b29">돌아온 별</text>
<text x="736" y="326" font-size="11.5" fill="#66716a">옛 빈자리 · 가장 큰 개척지</text>
<rect x="700" y="446" width="268" height="130" rx="16" fill="#ffffff" stroke="#dfe3db" stroke-width="1.5"/>
<text x="716" y="472" font-size="15" font-weight="700" fill="#252b29">샛별</text>
<text x="716" y="490" font-size="11.5" fill="#66716a">덥고 늪과 균류 숲</text>
<rect x="372" y="520" width="250" height="110" rx="16" fill="#ffffff" stroke="#dfe3db" stroke-width="1.5"/>
<text x="388" y="546" font-size="15" font-weight="700" fill="#252b29">해곁별</text>
<text x="388" y="564" font-size="11.5" fill="#66716a">뜨거운 바위 · 사람 없음</text>
<rect x="420" y="214" width="200" height="170" rx="16" fill="#ffffff" stroke="#dfe3db" stroke-width="1.5"/>
<text x="436" y="240" font-size="15" font-weight="700" fill="#252b29">느림별의 위성</text>
<text x="436" y="258" font-size="11.5" fill="#66716a">고리의 그늘</text>
<path d="M150,230 L460,140 L830,186" fill="none" stroke="#9a978d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 7"/>
<path d="M294,174 L306,186 M306,174 L294,186" stroke="#9a978d" stroke-width="2.5"/>
<path d="M634,152 L646,164 M646,152 L634,164" stroke="#9a978d" stroke-width="2.5"/>
<text x="470" y="128" font-size="11.5" fill="#9a978d" text-anchor="middle" font-weight="400" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">옛 큰 건넘 — 닫힘의 세기에 닫혔다</text>
<path d="M150,230 L520,312" fill="none" stroke="#2f5d9e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="338" y="258" font-size="11.5" fill="#66716a" text-anchor="middle" font-weight="400" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">정기선 · 매일</text>
<path d="M120,390 L520,312" fill="none" stroke="#2f5d9e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="330" y="372" font-size="11.5" fill="#66716a" text-anchor="middle" font-weight="400" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">11번</text>
<path d="M520,312 L830,186" fill="none" stroke="#2f5d9e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="690" y="236" font-size="11.5" fill="#66716a" text-anchor="middle" font-weight="400" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">7번</text>
<path d="M520,312 L880,530" fill="none" stroke="#2f5d9e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="700" y="420" font-size="11.5" fill="#66716a" text-anchor="middle" font-weight="400" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">샛별선</text>
<path d="M150,230 L120,390" fill="none" stroke="#2f5d9e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="124" y="316" font-size="11.5" fill="#66716a" text-anchor="end" font-weight="400" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">누리 안 항로</text>
<path d="M120,390 L330,500 L880,530" fill="none" stroke="#2f5d9e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 6"/>
<text x="560" y="498" font-size="11.5" fill="#66716a" text-anchor="middle" font-weight="400" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">겹침철에만 열린다</text>
<path d="M520,312 L850,360" fill="none" stroke="#c4572f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6"/>
<text x="690" y="322" font-size="11.5" fill="#c4572f" text-anchor="middle" font-weight="400" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">개척 항로 L06</text>
<path d="M120,390 L250,595 L470,595" fill="none" stroke="#c4572f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6"/>
<text x="210" y="616" font-size="11.5" fill="#c4572f" text-anchor="middle" font-weight="400" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">채굴단이 쓰는 개척 항로</text>
<circle cx="230" cy="300" r="26" fill="url(#hatch)" stroke="#8f78bf" stroke-width="1.5"/>
<text x="230" y="342" font-size="11.5" fill="#6f5a9e" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">기둥벌 · 금지 구역</text>
<circle cx="150" cy="230" r="9" fill="#ffffff" stroke="#2f5d9e" stroke-width="3"/>
<circle cx="120" cy="390" r="9" fill="#ffffff" stroke="#2f5d9e" stroke-width="3"/>
<circle cx="520" cy="312" r="13" fill="#ffffff" stroke="#2f5d9e" stroke-width="4"/>
<circle cx="830" cy="186" r="9" fill="#ffffff" stroke="#2f5d9e" stroke-width="3"/>
<circle cx="850" cy="360" r="9" fill="#ffffff" stroke="#c4572f" stroke-width="3"/>
<circle cx="880" cy="530" r="9" fill="#ffffff" stroke="#2f5d9e" stroke-width="3"/>
<circle cx="470" cy="595" r="9" fill="#ffffff" stroke="#c4572f" stroke-width="3"/>
<text x="150" y="210" font-size="13.5" fill="#252b29" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">호수문</text>
<text x="120" y="420" font-size="13.5" fill="#252b29" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">서항</text>
<text x="520" y="346" font-size="15" fill="#252b29" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">그늘역</text>
<text x="830" y="222" font-size="13.5" fill="#252b29" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">바람고원 자유시</text>
<text x="850" y="394" font-size="13.5" fill="#252b29" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">첫발기지</text>
<text x="880" y="562" font-size="13.5" fill="#252b29" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">늪항</text>
<text x="470" y="622" font-size="13.5" fill="#252b29" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">그늘 쪽 채굴장</text>
<text x="520" y="366" font-size="11" fill="#66716a" text-anchor="middle" font-weight="400" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">모든 정기 항로가 만나는 환승역</text>
<text x="150" y="190" font-size="11" fill="#66716a" text-anchor="middle" font-weight="400" paint-order="stroke" stroke="#fbfaf6" stroke-width="4">수도 · 큰 호수 위의 문</text>
<rect x="700" y="596" width="268" height="112" rx="12" fill="#ffffff" stroke="#dfe3db"/>
<text x="716" y="620" font-size="13" font-weight="700" fill="#252b29">보는 법</text>
<line x1="716" y1="636" x2="766" y2="636" stroke="#2f5d9e" stroke-width="5" stroke-linecap="round"/>
<text x="778" y="640" font-size="12" fill="#252b29">정기 항로 (항로청 번호)</text>
<line x1="716" y1="656" x2="766" y2="656" stroke="#2f5d9e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10 6"/>
<text x="778" y="660" font-size="12" fill="#252b29">겹침철에만 열리는 항로</text>
<line x1="716" y1="676" x2="766" y2="676" stroke="#c4572f" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/>
<text x="778" y="680" font-size="12" fill="#252b29">개척 항로 (번호 없음, 위험)</text>
<line x1="716" y1="696" x2="766" y2="696" stroke="#9a978d" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 7"/>
<text x="778" y="700" font-size="12" fill="#252b29">닫힌 옛 길</text>
<text x="32" y="686" font-size="11.5" fill="#66716a">항로가 열리는 날과 시각은 항로 역서를 따른다.</text>
<text x="32" y="704" font-size="11.5" fill="#66716a">틈을 지나는 먼 항로는 몇 시간, 짧은 항로는 숨 몇 번이 걸린다.</text>
